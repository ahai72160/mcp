# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: ScreenshotOne API key
      port:
        type: number
        description: (Optional) Port to run the server on
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: { SCREENSHOTONE_API_KEY: config.apiKey } })
  exampleConfig:
    apiKey: YOUR_SCREENSHOTONE_API_KEY_HERE
